[tool.uv.workspace]
members = ["apps/api", "apps/workers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses callables (Depends, Query, …) in argument defaults by
# design — exempt them from B008 rather than littering noqa comments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/workers/tests"]
addopts = "-q"
