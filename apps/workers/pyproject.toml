[project]
name = "politikar-workers"
version = "0.1.0"
description = "Ingestion, claim extraction, verification cascade, scoring."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1.0",
  "asyncpg>=0.30,<1.0",
  "feedparser>=6.0",
  "httpx>=0.27,<1.0",
  "inngest>=0.5,<1.0",
  "loguru>=0.7,<1.0",
  "pydantic>=2.7,<3.0",
  "selectolax>=0.3,<1.0",
  "tenacity>=8.5,<10.0",
  "voyageai>=0.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["politikar_workers"]

[project.scripts]
politikar = "politikar_workers.cli:main"
