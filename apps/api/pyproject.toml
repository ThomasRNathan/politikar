[project]
name = "politikar-api"
version = "0.1.0"
description = "FastAPI admin / ingestion API for politikar."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "loguru>=0.7,<1.0",
  "pydantic>=2.7,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["politikar_api"]
