<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- politikar favicon: lowercase "p" monogram on brand terracotta.
       Drawn as vector strokes so it stays crisp at 16px with no font dependency. -->
  <rect width="32" height="32" rx="7" fill="#c2410c"/>
  <g fill="none" stroke="#fbf7ef" stroke-width="3.6" stroke-linecap="round">
    <line x1="10.8" y1="8" x2="10.8" y2="25"/>
    <circle cx="16" cy="12.5" r="4.7"/>
  </g>
</svg>
